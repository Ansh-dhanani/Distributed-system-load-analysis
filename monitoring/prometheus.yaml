apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: demo-shop
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [demo]
        relabel_configs:
          # Only the app pods, matched by label (prometheus/grafana also name
          # their port "http", so port-name alone would scrape them too).
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: demo-shop
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
          ports: [{ containerPort: 9090, name: http }]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 700m, memory: 1Gi }
          volumeMounts: [{ name: cfg, mountPath: /etc/prometheus }]
      volumes: [{ name: cfg, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: demo
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
