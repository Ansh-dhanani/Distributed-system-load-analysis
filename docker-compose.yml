# Local development stack — runs demo-shop with Postgres + Redis, no Kubernetes.
#
#   docker compose up --build          # app on http://localhost:8080
#   docker compose down -v             # stop and drop the DB volume
#
# This is the easiest way to poke at the app locally. For an automated
# pass/fail check of every endpoint, use ./scripts/smoke-test.sh instead.
services:
  app:
    build: ./apps/demo-shop
    image: demo-shop:local
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  pgdata: {}
