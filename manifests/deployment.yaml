apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: demo
  labels:
    app: php-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      containers:
        - name: php-apache
          # Official HPA walkthrough image: every request burns CPU on purpose.
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              # Load-tested: 500m is the sweet spot on 2× t3.small.
              # 1000m was tried and regressed (8 pods contended for ~3600m
              # allocatable + burned T3 CPU credits). Raise node capacity
              # before raising this limit.
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
