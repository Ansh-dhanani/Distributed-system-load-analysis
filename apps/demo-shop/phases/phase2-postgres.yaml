apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: demo
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo
  POSTGRES_DB: demo
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: postgres-auth }
          ports: [{ containerPort: 5432 }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 800m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      # Lab cluster has no StorageClass/provisioner, so a PVC would stay Pending
      # and block Postgres. Ephemeral by design (everything is torn down).
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-shop
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-shop }
  template:
    metadata:
      labels: { app: demo-shop }
    spec:
      containers:
        - name: app
          image: anshdhanani/demo-shop:latest
          ports: [{ containerPort: 80, name: http }]
          env:
            - name: DATABASE_URL
              value: postgresql://demo:demo@postgres.demo.svc.cluster.local:5432/demo
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-shop
  namespace: demo
spec:
  selector: { app: demo-shop }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: demo-shop, namespace: demo }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: demo-shop }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 60 }
