apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "/scripts/k6.js"]
          env:
            # Default target (demo-shop). scripts/run-load.sh overrides this per
            # run (it picks php-apache for load-test/k6-capacity.js, and accepts
            # TARGET_URL=http://php-apache.demo.svc.cluster.local to force it).
            - name: TARGET_URL
              value: "http://demo-shop.demo.svc.cluster.local"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
