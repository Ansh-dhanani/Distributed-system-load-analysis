all:
  children:
    control_plane:
      hosts:
        cp:
          ansible_host: CP_IP
          ansible_user: ubuntu
    workers:
      hosts:
        w1:
          ansible_host: W1_IP
          ansible_user: ubuntu
        w2:
          ansible_host: W2_IP
          ansible_user: ubuntu
  vars:
    ansible_ssh_private_key_file: ../ansible/keys/id_rsa
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
