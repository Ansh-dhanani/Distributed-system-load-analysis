---
# Re-running this playbook on a partially-built node is safe: everything is
# guarded with `creates:`. To force a clean rebuild on already-used nodes, run
#   ansible-playbook -i inventory.yml site.yml -e reset_cluster=true
# which runs `kubeadm reset` and removes the state that would otherwise block
# re-init / re-join.
- name: Init control plane
  hosts: control_plane
  become: true
  vars:
    containerd_socket: unix:///run/containerd/containerd.sock
  tasks:
    - name: Reset a previous control plane
      when: reset_cluster | default(false) | bool
      block:
        - name: kubeadm reset
          ansible.builtin.command: kubeadm reset -f --cri-socket {{ containerd_socket }}
          changed_when: true
        - name: Remove state that would block re-init
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/kubernetes/admin.conf
            - /etc/kubernetes/kubelet.conf
            - /etc/kubernetes/bootstrap-kubelet.conf
            - /etc/cni/net.d
            - /var/lib/etcd
            - /root/.kube
            - /home/ubuntu/.kube
        - name: Flush iptables rules left by the old cluster
          ansible.builtin.shell: |
            if command -v iptables >/dev/null; then
              iptables -F; iptables -t nat -F; iptables -t mangle -F
            fi
          changed_when: true

    - name: kubeadm init
      ansible.builtin.command: >
        kubeadm init --pod-network-cidr=192.168.0.0/16
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      args:
        creates: /etc/kubernetes/admin.conf
    - name: Setup kubeconfig for ubuntu
      ansible.builtin.shell: |
        mkdir -p /home/ubuntu/.kube
        cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown ubuntu:ubuntu /home/ubuntu/.kube/config
      args:
        creates: /home/ubuntu/.kube/config
    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false
    - name: Save join command locally
      ansible.builtin.copy:
        content: "{{ join_cmd.stdout }}"
        dest: /tmp/kubeadm_join.sh
        mode: '0755'
      delegate_to: localhost
      become: false

- name: Join workers
  hosts: workers
  become: true
  vars:
    containerd_socket: unix:///run/containerd/containerd.sock
  tasks:
    - name: Reset a previous worker
      when: reset_cluster | default(false) | bool
      block:
        - name: kubeadm reset
          ansible.builtin.command: kubeadm reset -f --cri-socket {{ containerd_socket }}
          changed_when: true
        - name: Remove state that would block re-join
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/kubernetes/kubelet.conf
            - /etc/kubernetes/bootstrap-kubelet.conf
            - /etc/cni/net.d
        - name: Flush iptables rules left by the old cluster
          ansible.builtin.shell: |
            if command -v iptables >/dev/null; then
              iptables -F; iptables -t nat -F; iptables -t mangle -F
            fi
          changed_when: true

    - name: Read join command
      ansible.builtin.slurp:
        src: /tmp/kubeadm_join.sh
      register: join_file
      delegate_to: localhost
      become: false
    - name: Join cluster
      ansible.builtin.command: "{{ join_file.content | b64decode | trim }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
